<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>你被骗辣</title>
    <style>
        html {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        table {
            max-width: 100%;
            border: 0.05rem solid #0000001f;
            border-radius: 0.1rem;
            border-spacing: 0;
            overflow: auto;
        }
        tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.04);
        }
        td, th {
            text-align: left;
            padding: 8px 12px;
        }
        th {
            min-width: 5rem;
        }
        td {
            border-top: 0.05rem solid #0000001f;
        }
        .iframe-example {
            position: relative;
            width: 640px;
            height: 360px;
            box-shadow: 0 0 8px #e5e9ef;
        }
        @supports (aspect-ratio: 16 / 9) {
            .iframe-example {
                max-width: 720px;
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
            }
        }
        .iframe-example iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<iframe src="//player.bilibili.com/player.html?aid=386733968&cid=794775520&autoplay=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
<hr>
</body>
</html>
